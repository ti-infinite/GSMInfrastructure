AWSTemplateFormatVersion: '2010-09-09'
Description: 'Rol for infrastructure execution with GitHub OIDC'

Parameters:
  Environment:
    Type: String
    Default: 'dev'
    AllowedValues: [dev, qa, prod]

  AppName:
    Type: String
    Default: GSMApplication
    Description: 'Nombre de la aplicación (ej. gsmapp)'

  GitHubOrg:
    Type: String
    Description: 'GitHub organization or username (e.g. my-org)'

  GitHubRepo:
    Type: String
    Description: 'GitHub repository name (e.g. my-repo). Use * para cualquier repo de la org.'

  GitHubBranch:
    Type: String
    Default: 'main'
    Description: 'Rama autorizada para asumir el rol. Usa * para cualquier rama.'

  CreateOIDCProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Crea el OIDC Provider de GitHub en esta cuenta. Pon "false" si ya existe
      uno previo (solo puede haber uno por cuenta para token.actions.githubusercontent.com).

Conditions:
  ShouldCreateOIDCProvider: !Equals [!Ref CreateOIDCProvider, 'true']

Resources:

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: infrastructure

  InfraExecutorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-${AppName}-infrastructure-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
                - ecs-tasks.amazonaws.com
                - s3.amazonaws.com
                - kms.amazonaws.com
                - cloudfront.amazonaws.com
            Action: sts:AssumeRole

          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOIDCProvider
                - !GetAtt GitHubOIDCProvider.Arn
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:infra-*'
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:backend-*'
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:frontend-*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: infrastructure

  ParametersResourcesPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${Environment}-${AppName}-parameters-resources-policy'
      Roles: [!Ref InfraExecutorRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sns:CreateTopic
              - sns:DeleteTopic
              - sns:Subscribe
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:TagResource
            Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${Environment}-*'
          - Effect: Allow
            Action:
              - budgets:CreateBudgetAction
              - budgets:DeleteBudgetAction
              - budgets:UpdateBudgetAction
              - budgets:DescribeBudgetAction
              - budgets:ModifyBudget
              - budgets:TagResource
              - budgets:UntagResource
            Resource: !Sub 'arn:${AWS::Partition}:budgets::*:budget/${Environment}-*'
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource:
              - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Environment}/*'
              - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/*'
          - Effect: Allow
            Action:
              - ssm:StartSession
              - ssm:TerminateSession
              - ssm:ResumeSession
              - ssm:DescribeSessions
              - ssm:GetConnectionStatus
            Resource: '*'
          - Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
            Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:*'
          - Effect: Allow
            Action:
              - iam:PassRole
              - iam:DetachRolePolicy
              - iam:DeleteRole
              - iam:GetRole
              - iam:CreateRole
              - iam:TagRole
              - iam:CreatePolicy
              - iam:AddRoleToInstanceProfile
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:GetPolicy
              - iam:PutPolicy
              - iam:PutRolePolicy
              - iam:DeletePolicy
              - iam:AttachRolePolicy
              - iam:ListPolicyVersions
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:ListRoles
              - iam:ListInstanceProfiles
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:GetInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
              - iam:TagInstanceProfile
              - iam:UntagInstanceProfile
              - iam:UntagRole
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::*:role/${Environment}-*'
              - !Sub 'arn:${AWS::Partition}:iam::*:policy/${Environment}-*'
              - !Sub 'arn:${AWS::Partition}:iam::*:instance-profile/${Environment}-*'
          - Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:ValidateTemplate
              - cloudformation:TagResource
              - cloudformation:UntagResource
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStacks
              - cloudformation:RollbackStack
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteStack
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
              - cloudformation:ListStackResources
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Environment}-*'
          - Effect: Allow
            Action:
              - events:PutRule
              - events:DeleteRule
              - events:DescribeRule
              - events:PutTargets
              - events:RemoveTargets
              - events:ListTargetsByRule
              - events:TagResource
              - events:UntagResource
            Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*'


  RuntimeResourcesPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${Environment}-${AppName}-runtime-resources-policy'
      Roles: [!Ref InfraExecutorRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ecs:CreateCluster
              - ecs:DeleteCluster
              - ecs:RegisterTaskDefinition
              - ecs:CreateService
              - ecs:UpdateService
              - ecs:DeleteService
              - ecs:DescribeClusters
              - ecs:ListServices
              - ecs:DescribeServices
              - ecs:TagResource
            Resource: 
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${Environment}-*
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${Environment}-*
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${Environment}-*
          - Effect: Allow
            Action:
              - ecs:DeregisterTaskDefinition
              - ecs:DescribeTaskDefinition
            Resource: '*'
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:DescribeLogGroups
              - logs:TagResource
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/*/${Environment}-*'
          - Effect: Allow
            Action:
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:CreateTargetGroup
              - elasticloadbalancing:DeleteTargetGroup
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeListeners
              - elasticloadbalancing:AddTags
            Resource: !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/net/${Environment}-*
          - Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:AddPermission
              - lambda:ListVersionsByFunction
              - lambda:PublishVersion
              - lambda:CreateAlias
              - lambda:DeleteAlias
              - lambda:TagResource
              - lambda:UntagResource
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${Environment}-*
          - Effect: Allow
            Action:
              - guardduty:CreateDetector
              - guardduty:DeleteDetector
              - guardduty:GetDetector
              - guardduty:UpdateDetector
              - guardduty:ListDetectors
              - guardduty:TagResource
              - guardduty:UntagResource
            Resource: !Sub 'arn:${AWS::Partition}:guardduty:${AWS::Region}:${AWS::AccountId}:detector/*'


  StaticResourcesPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${Environment}-${AppName}-static-resources-policy'
      Roles: [!Ref InfraExecutorRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:PutBucketPolicy
              - s3:GetBucketPolicy
              - s3:PutBucketVersioning
              - s3:PutEncryptionConfiguration
              - s3:PutBucketPublicAccessBlock
              - s3:PutBucketLogging
              - s3:TagResource
              - s3:ListBucket
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${Environment}-*-frontend'
              - !Sub 'arn:${AWS::Partition}:s3:::${Environment}-*-frontend/*'
          - Effect: Allow
            Action:
              - cloudfront:CreateDistribution
              - cloudfront:GetDistribution
              - cloudfront:UpdateDistribution
              - cloudfront:DeleteDistribution
              - cloudfront:CreateInvalidation
              - cloudfront:TagResource
            Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*'
          - Effect: Allow
            Action:
              - cloudfront:CreateOriginAccessControl
              - cloudfront:DeleteOriginAccessControl
              - cloudfront:GetOriginAccessControl
            Resource: '*'
          - Effect: Allow
            Action:
              - cloudfront:CreateFunction
              - cloudfront:UpdateFunction
              - cloudfront:DeleteFunction
              - cloudfront:PublishFunction
              - cloudfront:DescribeFunction
              - cloudfront:GetFunction
              - cloudfront:ListTagsForResource
            Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/*'
          - Effect: Allow
            Action:
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RunInstances
              - ec2:TerminateInstances
              - ec2:StopInstances
              - ec2:StartInstances
              - ec2:ModifyInstanceAttribute
              - ec2:ResetInstanceAttribute
              - ec2:AssociateAddress
              - ec2:DisassociateAddress
              - ec2:AllocateAddress
              - ec2:ReleaseAddress
              - ec2:DeleteTags
              - ec2:CreateTags
            Resource: 
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:*'
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}::image/ami-*'

          - Effect: Allow
            Action:
              - ec2:DescribeSecurityGroups
              - ec2:DescribeVpcs
              - ec2:DescribeRegions
              - ec2:DescribeSubnets
              - ec2:DescribeInstances
              - ec2:DescribeInstanceAttribute
              - ec2:DescribeInstanceStatus
              - ec2:DescribeAddresses
              - ec2:DescribeAddressesAttribute
              - ec2:DescribeNetworkInterfaces
            Resource: '*'
          - Effect: Allow
            Action:
              - ecr:CreateRepository
              - ecr:DeleteRepository
              - ecr:DescribeRepositories
              - ecr:PutImageScanningConfiguration
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:BatchCheckLayerAvailability
              - ecr:PutImage
              - ecr:ListImages
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:GetRepositoryPolicy
              - ecr:DescribeImages
              - ecr:BatchDeleteImage
              - ecr:TagResource
            Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Environment}-*'
          - Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action:
              - scheduler:CreateSchedule
              - scheduler:UpdateSchedule
              - scheduler:DeleteSchedule
              - scheduler:GetSchedule
              - scheduler:ListSchedules
              - scheduler:CreateScheduleGroup
              - scheduler:DeleteScheduleGroup
              - scheduler:GetScheduleGroup
              - scheduler:ListTagsForResource
              - scheduler:TagResource
              - scheduler:UntagResource
            Resource: '*'
          - Effect: Allow
            Action:
              - servicediscovery:CreatePrivateDnsNamespace
              - servicediscovery:GetNamespace
              - servicediscovery:ListNamespaces
              - servicediscovery:DeleteNamespace
              - servicediscovery:TagResource
              - servicediscovery:CreateService
              - servicediscovery:GetService
              - servicediscovery:ListServices
              - servicediscovery:DeleteService
              - servicediscovery:UpdateService
              - servicediscovery:GetServiceAttributes
              - servicediscovery:GetOperation
              - servicediscovery:UntagResource
            Resource: '*'
          - Effect: Allow
            Action:
              - route53:CreateHostedZone
              - route53:GetHostedZone
              - route53:ListHostedZonesByName
              - route53:ChangeResourceRecordSets
              - route53:GetChange
            Resource: '*'                       

Outputs:
  InfraRoleArn:
    Value: !GetAtt InfraExecutorRole.Arn
    Description: 'ARN del rol — úsalo como role-to-assume en el workflow de GitHub Actions'
  InfraRoleName:
    Value: !Ref InfraExecutorRole
  OIDCProviderArn:
    Condition: ShouldCreateOIDCProvider
    Value: !GetAtt GitHubOIDCProvider.Arn
    Description: 'ARN del OIDC Provider creado (guárdalo si necesitas referenciar en otras stacks)'
