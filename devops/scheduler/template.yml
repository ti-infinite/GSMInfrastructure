AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Scheduler para apagar/encender EC2 + gestionar EIP + ECS DesiredCount=0/1.
  Horario COT (UTC-5):
    Stop  Lun-Sab : xx:00 PM COT  = xx:00 UTC  cron(0 x ? * MON-SAT *)
    Start Lun-Sab : xx:00 AM COT  = xx:00 UTC  cron(0 x ? * MON-SAT *)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

  AppName:
    Type: String
    Default: GSMApplication
    Description: Nombre de la aplicación (ej. gsmapp)

  EC2InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: ID de la instancia EC2 (ej. i-0abc123def456)

  EIPAllocationId:
    Type: String
    Description: >
      AllocationId de la Elastic IP (ej. eipalloc-0abc123).
      Se desasocia antes de apagar y se reasocia al encender
      para evitar el cobro por EIP idle.

  ECSClusterName:
    Type: String
    Default: dev-cluster
    Description: Nombre del cluster ECS (ej. dev-cluster)

  GatewayServiceName:
    Type: String
    Default: dev-gateway-service

  AuthServiceName:
    Type: String
    Default: dev-auth-service

  ApplicationServiceName:
    Type: String
    Default: dev-application-service

  OperationsServiceName:
    Type: String
    Default: dev-operations-service

  SchedulerStartExpression:
    Type: String
    Default: cron(0 9 ? * MON-SAT *)
    
  SchedulerStopExpression:
    Type: String
    Default: cron(0 1 ? * MON-SAT *)

Resources:

  # ------------------------------------------------------------------ #
  #  IAM Role para la Lambda                                           #
  # ------------------------------------------------------------------ #
  SchedulerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-${AppName}-scheduler-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EC2EIPECSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:StopInstances
                  - ec2:StartInstances
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:AssociateAddress
                  - ec2:DisassociateAddress
                  - ec2:DescribeAddresses
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: scheduler

  # ------------------------------------------------------------------ #
  #  Lambda Function STOP                                              #
  # ------------------------------------------------------------------ #
  StopFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-${AppName}-ec2-stop'
      Description: 'Escala ECS a 0, desasocia EIP y detiene EC2'
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt SchedulerLambdaRole.Arn
      Timeout: 120
      Environment:
        Variables:
          INSTANCE_ID: !Ref EC2InstanceId
          EIP_ALLOCATION_ID: !Ref EIPAllocationId
          CLUSTER_NAME: !Ref ECSClusterName
          GATEWAY_SERVICE: !Ref GatewayServiceName
          AUTH_SERVICE: !Ref AuthServiceName
          APPLICATION_SERVICE: !Ref ApplicationServiceName
          OPERATIONS_SERVICE: !Ref OperationsServiceName
      Code:
        ZipFile: |
          import boto3
          import os
          import time
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          ec2 = boto3.client('ec2')
          ecs = boto3.client('ecs')

          INSTANCE_ID      = os.environ['INSTANCE_ID']
          EIP_ALLOC_ID     = os.environ['EIP_ALLOCATION_ID']
          CLUSTER          = os.environ['CLUSTER_NAME']
          SERVICES         = [
              os.environ['GATEWAY_SERVICE'],
              os.environ['AUTH_SERVICE'],
              os.environ['APPLICATION_SERVICE'],
              os.environ['OPERATIONS_SERVICE'],
          ]

          def scale_ecs(desired):
              for svc in SERVICES:
                  try:
                      resp = ecs.update_service(
                          cluster=CLUSTER,
                          service=svc,
                          desiredCount=desired
                      )
                      logger.info(f"ECS {svc} → desiredCount={desired}")
                  except Exception as e:
                      logger.warning(f"No se pudo escalar {svc}: {e}")

          def disassociate_eip():
              try:
                  addrs = ec2.describe_addresses(AllocationIds=[EIP_ALLOC_ID])['Addresses']
                  if not addrs:
                      logger.info("EIP no encontrada, nada que desasociar")
                      return
                  assoc_id = addrs[0].get('AssociationId')
                  if assoc_id:
                      ec2.disassociate_address(AssociationId=assoc_id)
                      logger.info(f"EIP desasociada: AssociationId={assoc_id}")
                  else:
                      logger.info("EIP ya estaba desasociada")
              except Exception as e:
                  logger.error(f"Error desasociando EIP: {e}")
                  raise

          def stop_instance():
              resp = ec2.describe_instances(InstanceIds=[INSTANCE_ID])
              state = resp['Reservations'][0]['Instances'][0]['State']['Name']
              if state in ('stopped', 'stopping'):
                  logger.info(f"Instancia ya en estado {state}, skip stop")
                  return
              ec2.stop_instances(InstanceIds=[INSTANCE_ID])
              logger.info(f"Instancia {INSTANCE_ID} detenida")

          def handler(event, context):
              logger.info(f"=== STOP iniciado. Evento: {event} ===")

              # 1. Escalar ECS a 0 para drenar contenedores
              scale_ecs(0)

              # 2. Esperar brevemente para que ECS procese el scale-down
              #    (no es estrictamente necesario para el apagado, pero evita
              #     que el agente ECS quede en estado inconsistente)
              time.sleep(10)

              # 3. Desasociar EIP antes de apagar (evita cobro de idle IP)
              disassociate_eip()

              # 4. Detener la instancia EC2
              stop_instance()

              return {'statusCode': 200, 'body': 'Stop completado'}
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: scheduler

  # ------------------------------------------------------------------ #
  #  Lambda Function START                                             #
  # ------------------------------------------------------------------ #
  StartFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-${AppName}-ec2-start'
      Description: 'Enciende EC2, reasocia EIP y escala ECS a 1'
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt SchedulerLambdaRole.Arn
      Timeout: 300
      Environment:
        Variables:
          INSTANCE_ID: !Ref EC2InstanceId
          EIP_ALLOCATION_ID: !Ref EIPAllocationId
          CLUSTER_NAME: !Ref ECSClusterName
          GATEWAY_SERVICE: !Ref GatewayServiceName
          AUTH_SERVICE: !Ref AuthServiceName
          APPLICATION_SERVICE: !Ref ApplicationServiceName
          OPERATIONS_SERVICE: !Ref OperationsServiceName
      Code:
        ZipFile: |
          import boto3
          import os
          import time
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO) 

          ec2 = boto3.client('ec2')
          ecs = boto3.client('ecs')

          INSTANCE_ID  = os.environ['INSTANCE_ID']
          EIP_ALLOC_ID = os.environ['EIP_ALLOCATION_ID']
          CLUSTER      = os.environ['CLUSTER_NAME']
          SERVICES     = [
              os.environ['GATEWAY_SERVICE'],
              os.environ['AUTH_SERVICE'],
              os.environ['APPLICATION_SERVICE'],
              os.environ['OPERATIONS_SERVICE'],
          ]

          def start_instance():
              resp = ec2.describe_instances(InstanceIds=[INSTANCE_ID])
              state = resp['Reservations'][0]['Instances'][0]['State']['Name']
              if state == 'running':
                  logger.info("Instancia ya está running")
                  return
              if state not in ('stopped',):
                  logger.info(f"Instancia en estado {state}, esperando stopped...")
                  waiter = ec2.get_waiter('instance_stopped')
                  waiter.wait(InstanceIds=[INSTANCE_ID],
                              WaiterConfig={'Delay': 10, 'MaxAttempts': 30})
              ec2.start_instances(InstanceIds=[INSTANCE_ID])
              logger.info(f"Instancia {INSTANCE_ID} iniciada, esperando running...")

          def wait_running():
              waiter = ec2.get_waiter('instance_running')
              waiter.wait(
                  InstanceIds=[INSTANCE_ID],
                  WaiterConfig={'Delay': 10, 'MaxAttempts': 30}
              )
              logger.info("Instancia en estado running")

          def associate_eip():
              # Verificar si ya tiene la EIP asociada
              addrs = ec2.describe_addresses(AllocationIds=[EIP_ALLOC_ID])['Addresses']
              if addrs and addrs[0].get('InstanceId') == INSTANCE_ID:
                  logger.info("EIP ya asociada a esta instancia")
                  return
              # Reasociar (AllowReassociation=True por si acaso)
              resp = ec2.associate_address(
                  InstanceId=INSTANCE_ID,
                  AllocationId=EIP_ALLOC_ID,
                  AllowReassociation=True
              )
              logger.info(f"EIP reasociada: AssociationId={resp['AssociationId']}")

          def scale_ecs(desired):
              # Esperar que el agente ECS esté registrado en el cluster
              # antes de intentar levantar tareas
              time.sleep(30)
              for svc in SERVICES:
                  try:
                      ecs.update_service(
                          cluster=CLUSTER,
                          service=svc,
                          desiredCount=desired
                      )
                      logger.info(f"ECS {svc} → desiredCount={desired}")
                  except Exception as e:
                      logger.warning(f"No se pudo escalar {svc}: {e}")

          def handler(event, context):
              logger.info(f"=== START iniciado. Evento: {event} ===")

              # 1. Encender EC2
              start_instance()

              # 2. Esperar a running
              wait_running()

              # 3. Reasociar EIP (la IP pública no cambia)
              associate_eip()

              # 4. Escalar ECS a 1 (el agente ECS ya está activo)
              scale_ecs(1)

              return {'statusCode': 200, 'body': 'Start completado'}
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: scheduler

  # ------------------------------------------------------------------ #
  #  CloudWatch Log Groups para las Lambdas                            #
  # ------------------------------------------------------------------ #
  StopFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Environment}-${AppName}-ec2-stop'
      RetentionInDays: 14

  StartFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Environment}-${AppName}-ec2-start'
      RetentionInDays: 14

  # ------------------------------------------------------------------ #
  #  EventBridge Scheduler — Role                                      #
  # ------------------------------------------------------------------ #
  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-${AppName}-eventbridge-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt StopFunction.Arn
                  - !GetAtt StartFunction.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: scheduler

  # ------------------------------------------------------------------ #
  #  EventBridge Scheduler Group                                       #
  # ------------------------------------------------------------------ #
  SchedulerGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub '${Environment}-${AppName}-ec2-schedules'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: scheduler

  # ------------------------------------------------------------------ #
  #  Schedule 1 — STOP Lun-Sáb a las 2:00 UTC (9:00 PM COT)            #
  # ------------------------------------------------------------------ #
  StopScheduleWeekdays:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Environment}-${AppName}-stop-lun-sab'
      Description: 'Apaga EC2 Lun-Sáb a las 9pm COT (02:00 UTC)'
      GroupName: !Ref SchedulerGroup
      ScheduleExpression: !Ref SchedulerStopExpression
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt StopFunction.Arn
        RoleArn: !GetAtt SchedulerExecutionRole.Arn
        Input: '{"action": "stop", "trigger": "weekday-night"}'
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

  # ------------------------------------------------------------------ #
  #  Schedule 2 — STOP Domingo desde las 5:00 UTC (12:00 AM COT)       #
  # ------------------------------------------------------------------ #
  # StopScheduleSunday:
  #   Type: AWS::Scheduler::Schedule
  #   Properties:
  #     Name: !Sub '${Environment}-${AppName}-stop-domingo'
  #     Description: 'Apaga EC2 el domingo a las 12am COT (05:00 UTC)'
  #     GroupName: !Ref SchedulerGroup
  #     ScheduleExpression: 'cron(0 5 ? * SUN *)'
  #     ScheduleExpressionTimezone: UTC
  #     FlexibleTimeWindow:
  #       Mode: 'OFF'
  #     State: ENABLED
  #     Target:
  #       Arn: !GetAtt StopFunction.Arn
  #       RoleArn: !GetAtt SchedulerExecutionRole.Arn
  #       Input: '{"action": "stop", "trigger": "sunday-allday"}'
  #       RetryPolicy:
  #         MaximumRetryAttempts: 2
  #         MaximumEventAgeInSeconds: 3600

  # ------------------------------------------------------------------ #
  #  Schedule 3 — START Lun-Sáb a las 12:00 UTC (7:00 AM COT)          #
  # ------------------------------------------------------------------ #
  StartScheduleWeekdays:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Environment}-${AppName}-start-lun-sab'
      Description: 'Enciende EC2 Lun-Sáb a las 7am COT (12:00 UTC)'
      GroupName: !Ref SchedulerGroup
      ScheduleExpression: !Ref SchedulerStartExpression
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt StartFunction.Arn
        RoleArn: !GetAtt SchedulerExecutionRole.Arn
        Input: '{"action": "start", "trigger": "weekday-morning"}'
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

  # ------------------------------------------------------------------ #
  #  Permisos para que EventBridge Scheduler invoque las Lambdas       #
  # ------------------------------------------------------------------ #
  StopFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt StopFunction.Arn
      Action: lambda:InvokeFunction
      Principal: scheduler.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${SchedulerGroup}/*'

  StartFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt StartFunction.Arn
      Action: lambda:InvokeFunction
      Principal: scheduler.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${SchedulerGroup}/*'

Outputs:
  StopFunctionArn:
    Description: ARN de la Lambda de Stop
    Value: !GetAtt StopFunction.Arn

  StartFunctionArn:
    Description: ARN de la Lambda de Start
    Value: !GetAtt StartFunction.Arn

  SchedulerGroupName:
    Description: Nombre del grupo de schedules en EventBridge
    Value: !Ref SchedulerGroup

  HorarioCOT:
    Description: Resumen del horario configurado
    Value: 'Stop Lun-Sab 9pm COT | Start Lun-Sab 7am COT'